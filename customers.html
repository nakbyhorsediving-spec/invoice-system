<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お客様請求管理台帳 - YUYA GROUP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-file-invoice-dollar text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">お客様請求管理台帳</h1>
                    <p class="text-xs text-slate-400">YUYA GROUP 請求・顧客データベースシステム</p>
                </div>
            </div>

            <!-- 右側アクションボタン -->
            <div class="flex items-center space-x-3">
                <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="handleCSVFileSelect(event)">
                <button onclick="loadAutoCSV()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition flex items-center shadow-md">
                    <i class="fa-solid fa-rotate mr-1.5 text-white"></i> 最新データ再読み込み
                </button>
                <button onclick="document.getElementById('csv-file-input').click()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition flex items-center">
                    <i class="fa-solid fa-folder-open mr-1.5 text-blue-400"></i> 手動指定
                </button>
                <button id="btn-export-csv" onclick="exportToCSV()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium transition flex items-center shadow-sm">
                    <i class="fa-solid fa-file-export mr-1.5"></i> CSV保存
                </button>
                <button id="btn-add-customer" onclick="openNewCustomerModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition flex items-center shadow-sm">
                    <i class="fa-solid fa-user-plus mr-1.5"></i> 新規お客様登録
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- ステータス ＆ アラートバー -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div id="status-icon-bg" class="p-2 bg-emerald-50 text-emerald-600 rounded-lg">
                    <i id="status-icon" class="fa-solid fa-circle-check text-lg"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">データ読み込み状態</span>
                    <p id="file-status-text" class="text-sm font-bold text-emerald-700">自動読込確認中...</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-500">登録済み顧客数: <strong id="customer-count" class="text-slate-800 text-sm">0</strong> 件</span>
            </div>
        </div>

        <!-- 検索・フィルター領域 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="relative max-w-sm w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="お客様番号・会社名・担当者で検索..." class="pl-10 pr-4 py-2 text-sm w-full border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- テーブル領域 -->
            <div class="overflow-x-auto border border-slate-200 rounded-lg">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs text-slate-700 uppercase border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 font-semibold w-36 text-center">請求書作成</th>
                            <th class="px-4 py-3 font-semibold w-32">お客様番号</th>
                            <th class="px-4 py-3 font-semibold">会社名</th>
                            <th class="px-4 py-3 font-semibold">住所</th>
                            <th class="px-4 py-3 font-semibold w-36">電話番号</th>
                            <th class="px-4 py-3 font-semibold w-36">担当者</th>
                            <th class="px-4 py-3 font-semibold w-24 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- モーダル: 新規登録 / 編集 -->
    <div id="modal-form" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">新規お客様登録</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="customer-form" onsubmit="saveCustomer(event)" class="space-y-3">
                <input type="hidden" id="edit-original-id">

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">お客様番号 (自動採番)</label>
                    <input type="text" id="form-id" readonly class="w-full px-3 py-2 text-sm bg-slate-100 border border-slate-300 rounded-lg text-slate-500 font-bold focus:outline-none cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">会社名 *</label>
                    <input type="text" id="form-company" required placeholder="例: 株式会社サンプル" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">住所</label>
                    <input type="text" id="form-address" placeholder="例: 東京都千代田区1-1-1" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">電話番号</label>
                    <input type="text" id="form-phone" placeholder="例: 03-1234-5678" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">担当者名</label>
                    <input type="text" id="form-contact" placeholder="例: 山田 太郎" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 自動読み込みを行うファイル名を customers.csv に設定
        const DEFAULT_CSV_FILENAME = 'customers.csv';

        let customers = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadAutoCSV();
        });

        // customers.csv を自動取得
        function loadAutoCSV() {
            document.getElementById('file-status-text').innerText = "最新データ（" + DEFAULT_CSV_FILENAME + "）を読み込んでいます...";
            
            fetch(DEFAULT_CSV_FILENAME + '?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error("ファイルが見つかりません");
                    }
                    return response.text();
                })
                .then(text => {
                    parseCSV(text);
                    document.getElementById('status-icon-bg').className = "p-2 bg-emerald-50 text-emerald-600 rounded-lg";
                    document.getElementById('status-icon').className = "fa-solid fa-circle-check text-lg";
                    document.getElementById('file-status-text').className = "text-sm font-bold text-emerald-700";
                    document.getElementById('file-status-text').innerText = `${DEFAULT_CSV_FILENAME} (自動読み込み完了)`;
                })
                .catch(error => {
                    const localData = localStorage.getItem('yuya_customer_db');
                    if (localData) {
                        try { customers = JSON.parse(localData); } catch(e) {}
                    }
                    document.getElementById('status-icon-bg').className = "p-2 bg-amber-50 text-amber-600 rounded-lg";
                    document.getElementById('status-icon').className = "fa-solid fa-triangle-exclamation text-lg";
                    document.getElementById('file-status-text').className = "text-sm font-bold text-amber-600";
                    document.getElementById('file-status-text').innerText = `自動取得不可 (手動指定ボタンよりcustomers.csvを選んでください)`;
                    renderTable();
                });
        }

        function persistData() {
            localStorage.setItem('yuya_customer_db', JSON.stringify(customers));
            renderTable();
        }

        function generateNextCustomerId() {
            let maxNum = 0;
            customers.forEach(c => {
                if (c.id) {
                    const match = c.id.match(/\d+/);
                    if (match) {
                        const num = parseInt(match[0], 10);
                        if (num > maxNum) maxNum = num;
                    }
                }
            });
            return `CUS-${String(maxNum + 1).padStart(3, '0')}`;
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = customers.filter(c => 
                (c.id && c.id.toLowerCase().includes(search)) || 
                (c.company && c.company.toLowerCase().includes(search)) ||
                (c.contact && c.contact.toLowerCase().includes(search))
            );

            document.getElementById('customer-count').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400 text-xs">該当するお客様データが存在しません</td></tr>`;
                return;
            }

            filtered.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3 text-center">
                        <button onclick="createInvoiceForCustomer('${c.id}')" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold shadow-sm transition flex items-center justify-center mx-auto">
                            <i class="fa-solid fa-file-invoice mr-1"></i> 請求書作成
                        </button>
                    </td>
                    <td class="px-4 py-3 font-semibold text-slate-700">${escapeHtml(c.id)}</td>
                    <td class="px-4 py-3 font-bold text-slate-900">${escapeHtml(c.company)}</td>
                    <td class="px-4 py-3 text-xs text-slate-500">${escapeHtml(c.address || '-')}</td>
                    <td class="px-4 py-3 text-xs text-slate-600">${escapeHtml(c.phone || '-')}</td>
                    <td class="px-4 py-3 text-xs text-slate-600">${escapeHtml(c.contact || '-')}</td>
                    <td class="px-4 py-3 text-center space-x-1">
                        <button onclick="editCustomer('${c.id}')" class="p-1.5 text-slate-500 hover:text-blue-600 rounded transition" title="編集">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteCustomer('${c.id}')" class="p-1.5 text-slate-500 hover:text-red-600 rounded transition" title="削除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function createInvoiceForCustomer(id) {
            const customer = customers.find(c => c.id === id);
            if (!customer) return;
            localStorage.setItem('selected_customer_for_invoice', JSON.stringify(customer));
            window.location.href = 'index.html';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function openNewCustomerModal() {
            document.getElementById('edit-original-id').value = '';
            document.getElementById('customer-form').reset();
            document.getElementById('form-id').value = generateNextCustomerId();
            toggleModal(true, false);
        }

        function toggleModal(show, isEdit = false) {
            const modal = document.getElementById('modal-form');
            const title = document.getElementById('modal-title');
            if (show) {
                title.innerText = isEdit ? "お客様情報の編集" : "新規お客様登録";
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function editCustomer(id) {
            const target = customers.find(c => c.id === id);
            if (!target) return;
            document.getElementById('edit-original-id').value = target.id;
            document.getElementById('form-id').value = target.id;
            document.getElementById('form-company').value = target.company;
            document.getElementById('form-address').value = target.address || '';
            document.getElementById('form-phone').value = target.phone || '';
            document.getElementById('form-contact').value = target.contact || '';
            toggleModal(true, true);
        }

        function saveCustomer(e) {
            e.preventDefault();
            const origId = document.getElementById('edit-original-id').value;
            const currentId = document.getElementById('form-id').value.trim();

            const item = {
                id: currentId,
                company: document.getElementById('form-company').value.trim(),
                address: document.getElementById('form-address').value.trim(),
                phone: document.getElementById('form-phone').value.trim(),
                contact: document.getElementById('form-contact').value.trim()
            };

            if (origId) {
                const idx = customers.findIndex(c => c.id === origId);
                if (idx !== -1) customers[idx] = item;
            } else {
                customers.push(item);
            }
            persistData();
            toggleModal(false);
        }

        function deleteCustomer(id) {
            if (confirm(`お客様番号: ${id} を削除してもよろしいですか？`)) {
                customers = customers.filter(c => c.id !== id);
                persistData();
            }
        }

        function exportToCSV() {
            const header = ['お客様番号', '会社名', '住所', '電話番号', '担当者'];
            const rows = customers.map(c => [
                `"${(c.id || '').replace(/"/g, '""')}"`,
                `"${(c.company || '').replace(/"/g, '""')}"`,
                `"${(c.address || '').replace(/"/g, '""')}"`,
                `"${(c.phone || '').replace(/"/g, '""')}"`,
                `"${(c.contact || '').replace(/"/g, '""')}"`
            ]);

            const csvContent = "\uFEFF" + [header.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = DEFAULT_CSV_FILENAME;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleCSVFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                parseCSV(e.target.result);
                document.getElementById('status-icon-bg').className = "p-2 bg-emerald-50 text-emerald-600 rounded-lg";
                document.getElementById('status-icon').className = "fa-solid fa-circle-check text-lg";
                document.getElementById('file-status-text').className = "text-sm font-bold text-emerald-700";
                document.getElementById('file-status-text').innerText = `${file.name} (指定読み込み完了)`;
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;
            const newCustomers = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                if (cols.length >= 2) {
                    const clean = cols.map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                    newCustomers.push({
                        id: clean[0] || '',
                        company: clean[1] || '',
                        address: clean[2] || '',
                        phone: clean[3] || '',
                        contact: clean[4] || ''
                    });
                }
            }
            if (newCustomers.length >= 0) {
                customers = newCustomers;
                persistData();
            }
        }
    </script>
</body>
</html>
